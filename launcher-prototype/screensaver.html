<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>bbot Screensaver</title>
<!-- Fonts and icons are bundled (vendor/), so the page starts fast and works offline. -->
<link rel="stylesheet" href="vendor/fonts/fonts.css">
<link rel="stylesheet" href="vendor/phosphor/fill/style.css">
<style>
  /* Lite bbot screensaver. bbot (github.com/bwndapp/bbot, MIT) is already WebGL-free: one SVG driven by springs.
     The bundle is vendored in vendor/bbot so it runs offline. This page only adds the screensaver director
     (mood cycling, reactions, night mode, burn-in drift) and a clock. Needs http://, not file:// (ES module). */
  :root {
    --bg: #07080a;
    --text: #eef0f2;
    --muted: rgba(247, 248, 250, 0.72);
    --faint: rgba(247, 248, 250, 0.38);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  /* The page around the tablet is grey so the black screen's edges show in the preview; on the tablet the screen fills it. */
  html, body { height: 100%; background: #33363c; color: var(--text); font-family: "Geist", system-ui, sans-serif; overflow: hidden; -webkit-font-smoothing: antialiased; }

  #screen { width: 1340px; height: 800px; position: absolute; left: 50%; top: 50%; overflow: hidden; transform-origin: center center; background: var(--bg); box-shadow: 0 0 0 1px rgba(255,255,255,0.08), 0 24px 60px rgba(0,0,0,0.45); }

  /* --face-skin must match what sits behind the head, or the lids seam (see bbot README). */
  #bot { position: absolute; left: 50%; top: 50%; width: 660px; height: 660px; margin: -330px 0 0 -330px;
    --face-skin: var(--bg); --face-ink: #e9ebec; --face-ring: transparent; --face-pupil: var(--bg); }

  .drift { position: absolute; inset: 0; will-change: transform; }

  /* Clock and weather sit in the top-left corner (inset clears the ±40/±20px drift); the song scrolls bottom-centre. */
  /* The 24-hour time is tall and narrow (Sofia Sans Extra Condensed Bold, a free stand-in for iOS's compressed SF clock);
     the date and place stay small and muted in Geist.
     Time + date on the left, a hairline, then the weather to their right. */
  .clock { position: absolute; left: 56px; top: 48px; display: flex; align-items: center; gap: 28px; color: var(--text); pointer-events: none; }
  .clock .t { font: 700 112px/0.82 "Sofia Sans Extra Condensed", "Geist", sans-serif; letter-spacing: -0.01em; font-variant-numeric: tabular-nums; }
  .clock .d { font-size: 19px; margin-top: 12px; color: var(--muted); }
  .clock .rule { width: 1px; align-self: stretch; margin: 6px 0; background: var(--faint); }
  /* Weather: static glass icon (no animation, so the screensaver stays idle), temperature + condition, place underneath. */
  .clock .wx { display: flex; align-items: center; gap: 12px; }
  .clock .wx img { width: 52px; height: 52px; object-fit: contain; flex: none; }
  .clock .wx .now { font-size: 19px; color: var(--text); font-variant-numeric: tabular-nums; }
  .clock .wx .loc { font-size: 15px; color: var(--muted); margin-top: 3px; max-width: 360px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  /* Lite: with &noface the face is off and the clock and weather sit large in the middle. */
  /* Lite: flat controls like Car Home Lite's player: plain white skip icons, a solid light circle for play/pause.
     Solid colours, no rim, no fade or press animation. */
  #screen.lite .media { gap: 40px; transition: none; }
  #screen.lite .media button { font-size: 36px; background: none; box-shadow: none; transition: none; color: #f1f3f5; }
  #screen.lite .media button.play { width: 84px; height: 84px; font-size: 38px; background: #f1f3f5; color: #0e1013; }
  #screen.lite .media button:active { transform: none; background: none; opacity: 0.6; }
  #screen.lite .media button.play:active { background: #f1f3f5; }
  #screen.noface #bot { display: none; }
  #screen.noface .clock { left: 50%; top: 50%; transform: translate(-50%, -62%); flex-direction: column; gap: 22px; text-align: center; }
  #screen.noface .clock .t { font-size: 220px; }
  #screen.noface .clock .rule { display: none; }
  .song { position: absolute; left: 50%; bottom: 72px; width: 640px; margin-left: -320px; overflow: hidden; white-space: nowrap; font-size: 17px; color: var(--muted);
    -webkit-mask-image: linear-gradient(90deg, transparent, #000 8%, #000 92%, transparent); mask-image: linear-gradient(90deg, transparent, #000 8%, #000 92%, transparent);
    opacity: 0; transition: opacity 0.5s; pointer-events: none; }
  .song.on { opacity: 1; }
  /* Paused: the line stays (so the controls make sense) but stops scrolling and steps back. */
  .song.on.paused { opacity: 0.55; }
  .song.paused .track { animation-play-state: paused; }

  /* Music controls above the song: three big round glass buttons, sized for a thumb at arm's length (64 / 80 / 64 px,
     32px apart). Same lit rim as the launcher's glass controls. They drift with the rest of the screen (burn-in) and only
     show while there is a song. Presses never reach the face gestures or tap-to-home. */
  .media { position: absolute; left: 50%; bottom: 136px; transform: translateX(-50%); display: flex; align-items: center; gap: 32px;
    opacity: 0; pointer-events: none; transition: opacity 0.5s; }
  .media.on { opacity: 1; pointer-events: auto; }
  .media button { width: 64px; height: 64px; border-radius: 999px; display: grid; place-items: center; border: 0; cursor: pointer;
    font-size: 28px; color: var(--text); background: rgba(255,255,255,0.07); -webkit-tap-highlight-color: transparent;
    box-shadow: inset 1.5px 1.5px 0 -0.5px rgba(255,255,255,0.45), inset -1.5px -1.5px 0 -0.5px rgba(255,255,255,0.22), inset 0 0 0 1px rgba(255,255,255,0.10);
    transition: transform 0.15s ease, background 0.15s ease; }
  .media button.play { width: 80px; height: 80px; font-size: 34px; background: rgba(255,255,255,0.13); }
  .media button:active { transform: scale(0.94); background: rgba(255,255,255,0.2); }
  @media (prefers-reduced-motion: reduce) { .media button { transition: none; } }
  .song .track { display: inline-block; padding-right: 64px; animation: marquee 14s linear infinite; }
  .song .track b { font-weight: 600; color: var(--text); }
  @keyframes marquee { from { transform: translateX(0); } to { transform: translateX(-50%); } }
  @media (prefers-reduced-motion: reduce) { .song .track { animation: none; } }

</style>
</head>
<body>
<div id="screen">
  <div class="drift" id="drift">
    <div id="bot"></div>
    <div class="clock"><div><div class="t" id="time">--:--</div><div class="d" id="date"></div></div><div class="rule"></div>
      <div class="wx"><img id="wxIcon" alt="" src="vendor/weatherglass/partly_cloudy_day.png"><div><div class="now" id="weather">--&deg;</div><div class="loc" id="place">Sumedang Utara, Sumedang</div></div></div></div>
    <div class="media" id="media" aria-label="Music controls">
      <button data-cmd="prev" aria-label="Previous"><i class="ph-fill ph-skip-back"></i></button>
      <button class="play" data-cmd="toggle" id="playBtn" aria-label="Pause"><i class="ph-fill ph-pause"></i></button>
      <button data-cmd="next" aria-label="Next"><i class="ph-fill ph-skip-forward"></i></button>
    </div>
    <div class="song" id="song"><span class="track" id="song-text"></span></div>
  </div>
</div>

<script type="module">
  import { createFace } from './vendor/bbot/face.js';

  const W = 1340, H = 800;
  const screenEl = document.getElementById('screen');
  // Opened from the launcher's screensaver button: a single tap goes back home (the other gestures still play with the face).
  const fromHome = new URLSearchParams(location.search).get('from') === 'home';
  // Which home to go back to (glass.html, or lite.html for Car Home Lite).
  const HOME = /^[\w-]+\.html$/.test(new URLSearchParams(location.search).get('home') || '') ? new URLSearchParams(location.search).get('home') : 'glass.html';
  // Lite (screensaver.html?lite, from Car Home Lite): the face moves in bursts. It animates only while it has something
  // to do (a mood change, reaction or glance from the director below, spaced out in lite, or a touch), then holds still,
  // so the tablet draws nothing in between. While awake it draws at most 30 frames a
  // second instead of 60: its springs are timed from elapsed time but step at most 1/30 s, so 30 fps keeps full speed.
  // Measured on the tablet: face at 60 fps ~175% CPU, 30 fps ~130%, still clock ~11%.
  // &fps=<n> sets the frame rate, &nonstop animates all the time, &noface turns the face off (still clock).
  const qs = new URLSearchParams(location.search), LITE = qs.has('lite'), CALM = LITE && !qs.has('nonstop');
  if (LITE) {
    document.getElementById('screen').classList.add('lite');
    if (qs.has('noface')) document.getElementById('screen').classList.add('noface');
    const step = 1000 / (+qs.get('fps') || 30), BURST = 3000;
    // One shared frame timer: everything that animates (the face, the song line) draws in the same frame, not twice.
    let awakeUntil = Infinity, nextId = 1, timer = 0, queue = [], parked = []; // parked: frames held while asleep
    const flush = () => {
      timer = 0; const q = queue, t = performance.now(); queue = [];
      q.forEach(f => f.cb(t));
    };
    // Eyes shut mid-blink: keep drawing until they open, so the face never pauses with its eyes closed (unless asleep).
    const lid = () => document.querySelector('#bot .bwf-lid');
    const eyesShut = () => { const m = /translate\(0 (-?[\d.]+)\)/.exec(lid()?.getAttribute('transform') || ''); return m && +m[1] > -4; };
    window.requestAnimationFrame = cb => {
      const f = { id: nextId++, cb };
      if (performance.now() >= awakeUntil && window.faceMood !== 'sleep' && eyesShut()) awakeUntil = performance.now() + 200;
      if (performance.now() < awakeUntil) { queue.push(f); timer ||= setTimeout(flush, step); }
      else parked.push(f);
      return f.id;
    };
    window.cancelAnimationFrame = id => { queue = queue.filter(f => f.id !== id); parked = parked.filter(f => f.id !== id); };
    window.wakeFace = (ms = BURST) => {
      awakeUntil = Math.max(awakeUntil === Infinity ? 0 : awakeUntil, performance.now() + ms);
      const ps = parked; parked = []; ps.forEach(f => requestAnimationFrame(f.cb));
    };
    if (!qs.has('nonstop')) {
      awakeUntil = performance.now() + BURST; // settle in, then sleep
      addEventListener('pointerdown', () => wakeFace(4000), true);
    }
  }
  const botEl = document.getElementById('bot');

  // The lids are filled with the background, so fully shut eyes (asleep, a blink) vanish. Stop the lids just short of
  // meeting: a thin slit of eye stays, which reads as a closed eye. face.js moves each lid with
  // setAttribute('transform', 'rotate(a) translate(0 y)'); the top lid's edge is at y, the bottom lid's at y too.
  const SLIT = 0.6;   // half the slit, in face units (the eye radius is 12); ~8 px on screen
  const setAttr = SVGRectElement.prototype.setAttribute;
  SVGRectElement.prototype.setAttribute = function (k, v) {
    if (k === 'transform' && this.classList.contains('bwf-lid'))
      v = v.replace(/translate\(0 (-?[\d.]+)\)/, (m, y) =>
        `translate(0 ${(this.getAttribute('y') === '0' ? Math.max(+y, SLIT) : Math.min(+y, -SLIT)).toFixed(2)})`);
    return setAttr.call(this, k, v);
  };

  // Fit the 1340x800 design canvas to any window, same as glass.html.
  function fit() {
    const s = Math.min(innerWidth / W, innerHeight / H);
    screenEl.style.transform = `translate(-50%, -50%) scale(${s})`;
  }
  addEventListener('resize', fit); fit();

  const face = createFace(botEl, { expression: 'idle', mouth: false });
  window.face = face; // handy for poking at it from devtools
  // Lite burst mode: whatever the face is told to do (mood, reaction, glance) wakes it long enough to play out.
  if (window.wakeFace) for (const k of ['setExpression', 'react', 'look']) {
    const fn = face[k].bind(face);
    face[k] = (...args) => { wakeFace(k === 'look' ? (args[2] || 1500) + 800 : 2500); return fn(...args); };
  }

  // ---- Director: weighted mood cycling, mostly calm. Each entry is [mood, weight]. ----
  const DAY = [['idle', 6], ['content', 4], ['happy', 3], ['curious', 3], ['thinking', 2], ['relieved', 2],
               ['excited', 1], ['love', 1], ['shy', 1], ['confused', 1], ['smug', 1], ['suspicious', 1],
               ['bored', 1], ['focus', 1], ['sleepy', 1]];
  const NIGHT = [['sleepy', 5], ['sleep', 4], ['idle', 2], ['content', 2], ['relieved', 1]];
  // Small reaction that suits a mood when it starts; anything not listed gets none.
  const ENTRY = { happy: 'nod', excited: 'bounce', love: 'pop', confused: 'shake', curious: 'boing', surprised: 'pop', relieved: 'nod' };

  const rand = (a, b) => a + Math.random() * (b - a);
  const isNight = () => { const h = new Date().getHours(); return h >= 22 || h < 6; };
  function pick(list, not) {
    const pool = list.filter(([m]) => m !== not);
    let r = Math.random() * pool.reduce((s, [, w]) => s + w, 0);
    for (const [m, w] of pool) if ((r -= w) <= 0) return m;
    return pool[0][0];
  }

  let mood = 'idle', moodTimer, pinned = false;
  function nextMood() {
    if (!pinned) {
      mood = window.faceMood = pick(isNight() ? NIGHT : DAY, mood);
      face.setExpression(mood);
      if (ENTRY[mood]) setTimeout(() => face.react(ENTRY[mood]), 350);
      // Eyes shut means nothing to track; turn tracking back on otherwise.
      face.set({ track: mood !== 'sleep' });
    }
    clearTimeout(moodTimer);
    // Lite spaces moods out (each one is a burst of drawing).
    moodTimer = setTimeout(nextMood, mood === 'sleep' ? rand(20000, 40000) : CALM ? rand(16000, 26000) : rand(7000, 15000));
  }
  moodTimer = setTimeout(nextMood, 4000);

  // Now and then a wink or a glance while awake, so long holds don't feel frozen.
  (function fidget() {
    setTimeout(() => {
      if (mood !== 'sleep' && mood !== 'sleepy') {
        Math.random() < 0.35 ? face.react('wink') : face.look(rand(-1, 1), rand(-0.6, 0.4), rand(900, 1800));
      }
      fidget();
    }, CALM ? rand(12000, 22000) : rand(6000, 14000));
  })();

  // ---- Burn-in drift: face and clock wander ±40/±20px over minutes. Moved at 1 Hz (every 10 s in lite, where each
  // screen update costs); the SVG itself animates. ----
  const drift = document.getElementById('drift');
  setInterval(() => {
    const t = performance.now();
    drift.style.transform = `translate(${(Math.sin(t / 47000) * 40).toFixed(1)}px, ${(Math.cos(t / 61000) * 20).toFixed(1)}px)`;
  }, CALM ? 10000 : 1000);

  // ---- Clock ----
  const timeEl = document.getElementById('time'), dateEl = document.getElementById('date');
  function tick() {
    const d = new Date();
    // 24-hour time, always two-digit hours (09:05, 13:15).
    // Written only when it changes: every repaint costs on the tablet.
    const t = `${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;
    if (timeEl.textContent === t) return;
    timeEl.textContent = t;
    dateEl.textContent = d.toLocaleDateString([], { weekday: 'short', day: 'numeric', month: 'short' });
  }
  setInterval(tick, 5000); tick();

  // ---- show(): hold a mood for a while (pausing the cycle), fire reactions, then hand back to the director. ----
  let wakeTimer;
  function show(expr, reactions = [], ms = 3500) {
    pinned = true;
    face.set({ track: true });
    face.setExpression(expr);
    [].concat(reactions).forEach((r, i) => setTimeout(() => face.react(r), i * 220));
    clearTimeout(wakeTimer);
    wakeTimer = setTimeout(() => { pinned = false; nextMood(); }, ms);
  }
  const asleep = () => mood === 'sleep' || mood === 'sleepy';

  // ---- Touch gestures. bbot's eyes already follow the finger on their own.
  //      tap: happy (startled awake if asleep), or back home when opened from the launcher · double tap: surprised → joy · 3+ quick taps: annoyed
  //      long press: love · rub back and forth: content, then relieved · fast swipe: spin → dizzy
  //      (Android DreamService needs setInteractive(true) for this, otherwise a touch closes the screensaver.) ----
  let down = null, taps = 0, tapTimer, pressTimer;
  const HOLD = 600, MOVE = 14;

  screenEl.addEventListener('pointerdown', e => {
    down = { x: e.clientX, y: e.clientY, t: performance.now(), lastX: e.clientX, dir: 0, flips: 0, path: 0, long: false };
    clearTimeout(pressTimer);
    pressTimer = setTimeout(() => {
      if (down && down.path < MOVE) { down.long = true; show('love', ['pop'], 4000); }
    }, HOLD);
  });

  screenEl.addEventListener('pointermove', e => {
    if (!down) return;
    const dx = e.clientX - down.lastX;
    down.path += Math.abs(dx);
    // Count direction reversals: three or more while pressed is a rub (petting).
    if (Math.abs(dx) > 6) {
      const dir = Math.sign(dx);
      if (down.dir && dir !== down.dir) {
        down.flips++;
        if (down.flips === 3) show('content', ['nod'], 3000);
        if (down.flips === 8) show('relieved', ['nod'], 4000);
      }
      down.dir = dir; down.lastX = e.clientX;
    }
  });

  addEventListener('pointerup', e => {
    if (!down) return;
    clearTimeout(pressTimer);
    const d = down; down = null;
    const dt = performance.now() - d.t, dx = e.clientX - d.x, dy = e.clientY - d.y;
    if (d.long || d.flips >= 3) return;
    // Swipe: a quick, mostly straight drag.
    if (dt < 350 && Math.hypot(dx, dy) > 160) { show('dizzy', ['spin'], 3500); return; }
    if (d.path > MOVE) return;
    // Taps: wait a beat to see whether more follow, then act on the count.
    taps++;
    clearTimeout(tapTimer);
    tapTimer = setTimeout(() => {
      if (taps >= 3) show('annoyed', ['shake'], 3500);
      else if (taps === 2) { show('surprised', ['pop'], 4000); setTimeout(() => face.setExpression('joy'), 900); }
      else if (fromHome) location.href = HOME;
      else show(asleep() ? 'surprised' : 'happy', ['bounce'], 3500);
      taps = 0;
    }, 280);
  });

  // ---- Car events. The Android app calls these from its listeners via WebView.evaluateJavascript("bbot.event('turn-left')").
  //      Open screensaver.html?debug to get buttons for them. ----
  let groove;
  const EVENTS = {
    'music-play':  () => { show('happy', ['nod'], 8000); clearInterval(groove);
                           if (analyser) return;
                           let n = 0; groove = setInterval(() => { face.react('nod'); if (++n > 10) clearInterval(groove); }, 650); },
    'music-pause': () => { clearInterval(groove); show('bored', [], 4000); },
    'turn-left':   () => { show('focus', [], 3000); face.look(-1, 0, 2500); },
    'turn-right':  () => { show('focus', [], 3000); face.look(1, 0, 2500); },
    'arrived':     () => show('joy', ['bounce', 'pop'], 5000),
    'call':        () => show('surprised', ['jitter', 'jitter'], 5000),
    'message':     () => { show('curious', ['boing'], 3500); face.look(0.6, -0.6, 1500); },
    'charging':    () => show('relieved', ['nod'], 4000),
    'battery-low': () => show('sleepy', [], 6000),
    'unplugged':   () => show('sleepy', [], 4000),
    'speeding':    () => show('scared', ['jitter'], 4000),
  };
  EVENTS.horn = () => { show('scared', ['jitter', 'jitter'], 1600); setTimeout(() => show('annoyed', ['shake'], 3000), 1600); };
  // While music plays the bar is higher, and right after it starts the detector holds off (a song's first chord looks like a horn).
  let musicOn = false, musicAt = -1e9;
  const playMusic = EVENTS['music-play'], pauseMusic = EVENTS['music-pause'];
  EVENTS['music-play'] = () => { musicOn = true; musicAt = performance.now(); playMusic(); };
  EVENTS['music-pause'] = () => { musicOn = false; pauseMusic(); };

  // ---- Horn detector (microphone). A horn is loud, tonal and steady: one strong peak in 300-700 Hz with a harmonic above it,
  //      well over the cabin's background level, holding the same pitch for 300 ms. Road noise isn't tonal, speech wobbles in pitch.
  //      Thresholds are tuned on synthetic sounds only; tune them in the car with ?debug, which shows the live numbers.
  //      getUserMedia needs a secure origin: on the tablet use `adb reverse tcp:8765 tcp:8765` and open http://localhost:8765. ----
  const HS = { on: false, bg: null, since: 0, last: 0, prevHz: 0, info: '', count: 0 };
  const HORN = { tone: 20, loud: 10, loudMusic: 8, hold: 300, cooldown: 4000, musicGrace: 4000 };
  let audioCtx;
  // One analyser, fed by the microphone and/or a test audio file.
  let analyser;
  function listenTo(source) {
    if (!analyser) {
      analyser = audioCtx.createAnalyser();
      analyser.fftSize = 4096; analyser.smoothingTimeConstant = 0.3;
      const bins = new Float32Array(analyser.frequencyBinCount), hz = audioCtx.sampleRate / analyser.fftSize;
      const lo = Math.round(300 / hz), hi = Math.round(700 / hz), top = Math.round(2000 / hz);
      const b0 = Math.round(40 / hz), b1 = Math.round(150 / hz);
      setInterval(() => { analyser.getFloatFrequencyData(bins); detectHorn(bins, hz, lo, hi, top); detectBeat(bins, b0, b1); }, 50);
    }
    source.connect(analyser);
    HS.on = true;
  }

  async function startMic() {
    try {
      const stream = await navigator.mediaDevices.getUserMedia({
        // Noise suppression would filter out exactly the steady tone we're after.
        audio: { echoCancellation: true, noiseSuppression: false, autoGainControl: false },
      });
      audioCtx = audioCtx || new AudioContext();
      listenTo(audioCtx.createMediaStreamSource(stream));
    } catch (e) {
      HS.info = 'Microphone not available here (' + e.name + '). Use "test audio file" instead.';
    }
  }

  // Plays a chosen file through the speakers and the detector at the same time. With asMusic the app "knows" it is
  // music (like it will know its own player), so the 4 s grace and the higher bar apply.
  // Nods to the music: a jump in bass energy (40-150 Hz) over its running average is a beat. Capped at ~2.5 nods/s.
  const BT = { avg: -100, last: 0 };
  function detectBeat(b, b0, b1) {
    let e = 0; for (let i = b0; i <= b1; i++) e += 10 ** (b[i] / 10);
    const bass = 10 * Math.log10(e + 1e-12), t = performance.now();
    const onset = bass > BT.avg + 5 && t - BT.last > 400;
    BT.avg = BT.avg * 0.92 + bass * 0.08;
    if (onset && musicOn && mood !== 'sleep') { BT.last = t; face.react('nod'); }
  }

  // ---- Now playing. The host (Android) pushes bbot.player.set({ title, artist, playing }) from the active media session;
  //      the screensaver shows it as a marquee with prev / play-pause / next above it. Presses go to bbot.player.onControl(cmd)
  //      ('prev' | 'toggle' | 'next'), which the host maps to MediaController.getTransportControls(). ----
  const PL = { title: '', artist: '', playing: false };
  const songEl = document.getElementById('song'), songText = document.getElementById('song-text');
  const mediaEl = document.getElementById('media'), playBtn = document.getElementById('playBtn');
  const esc = x => String(x).replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));
  function renderPlayer() {
    const line = PL.title ? `<b>${esc(PL.title)}</b>${PL.artist ? ' \u00b7 ' + esc(PL.artist) : ''}` : '';
    // Two copies so the loop is seamless.
    songText.innerHTML = line ? line + '<span style="display:inline-block;width:64px"></span>' + line : '';
    songEl.classList.toggle('on', !!PL.title);
    songEl.classList.toggle('paused', !PL.playing);
    mediaEl.classList.toggle('on', !!PL.title);
    playBtn.innerHTML = `<i class="ph-fill ph-${PL.playing ? 'pause' : 'play'}"></i>`;
    playBtn.setAttribute('aria-label', PL.playing ? 'Pause' : 'Play');
    // Same reading speed for any title length: about 45 px/s over one copy of the line.
    if (line) songText.style.animationDuration = Math.max(8, songText.scrollWidth / 2 / 45).toFixed(1) + 's';
  }
  const player = {
    state: PL,
    control: null,
    set(s) { Object.assign(PL, s); renderPlayer(); },
  };
  // Prototype only: a sample song with a long title so the marquee shows in the preview (?nosong hides it).
  // On the tablet the app pushes the real one instead.
  if (!window.Android && !new URLSearchParams(location.search).has('nosong'))
    player.set({ title: 'Zona Nyaman (OST. Filosofi Kopi 2: Ben & Jody)', artist: 'Fourtwnty', playing: true });


  // ---- Browser-side player: a queue of local files, routed through the analyser so horn/beat detection hear it. ----
  const Q = { files: [], i: -1, audio: null, src: null, notify: true };
  function tagsOf(file) {
    // Minimal ID3v2 reader: title and artist. Anything else falls back to the file name.
    return file.slice(0, 512 * 1024).arrayBuffer().then(buf => {
      const d = new DataView(buf), out = {};
      if (buf.byteLength < 10 || String.fromCharCode(d.getUint8(0), d.getUint8(1), d.getUint8(2)) !== 'ID3') return out;
      const ver = d.getUint8(3), syn = b => ((b >>> 24) & 0x7f) << 21 | ((b >>> 16) & 0x7f) << 14 | ((b >>> 8) & 0x7f) << 7 | (b & 0x7f);
      const end = Math.min(buf.byteLength, 10 + syn(d.getUint32(6)));
      let p = 10 + ((d.getUint8(5) & 0x40) ? (ver === 4 ? syn(d.getUint32(10)) : d.getUint32(10) + 4) : 0);
      const text = (off, len) => {
        const enc = d.getUint8(off), bytes = new Uint8Array(buf, off + 1, len - 1);
        const cs = enc === 0 ? 'latin1' : enc === 3 ? 'utf-8' : enc === 2 ? 'utf-16be' : 'utf-16';
        return new TextDecoder(cs).decode(bytes).replace(/\0+$/, '');
      };
      while (p + 10 <= end) {
        const id = String.fromCharCode(d.getUint8(p), d.getUint8(p + 1), d.getUint8(p + 2), d.getUint8(p + 3));
        const len = ver === 4 ? syn(d.getUint32(p + 4)) : d.getUint32(p + 4);
        if (!/^[A-Z0-9]{4}$/.test(id) || len <= 0 || p + 10 + len > end) break;
        const off = p + 10;
        if (id === 'TIT2') out.title = text(off, len);
        else if (id === 'TPE1') out.artist = text(off, len);
        p = off + len;
      }
      return out;
    }).catch(() => ({}));
  }
  async function playIndex(i) {
    if (!Q.files.length) return;
    Q.i = (i + Q.files.length) % Q.files.length;
    const file = Q.files[Q.i];
    audioCtx = audioCtx || new AudioContext(); audioCtx.resume();
    if (!Q.audio) {
      Q.audio = new Audio();
      Q.src = audioCtx.createMediaElementSource(Q.audio);
      Q.src.connect(audioCtx.destination); listenTo(Q.src);
      Q.audio.addEventListener('play', () => { player.set({ playing: true }); if (Q.notify) bbot.event('music-play'); });
      Q.audio.addEventListener('pause', () => { player.set({ playing: false }); if (Q.notify && !Q.audio.ended) bbot.event('music-pause'); });
      Q.audio.addEventListener('ended', () => playIndex(Q.i + 1));
    }
    if (Q.audio.src) URL.revokeObjectURL(Q.audio.src);
    Q.audio.src = URL.createObjectURL(file);
    const tags = await tagsOf(file);
    player.set({ title: tags.title || file.name.replace(/\.[^.]+$/, ''), artist: tags.artist || 'Local file' });
    Q.audio.play();
  }
  player.control = cmd => {
    if (!Q.audio) return;
    if (cmd === 'toggle') cmd = Q.audio.paused ? 'play' : 'pause';
    if (cmd === 'play') Q.audio.play(); else if (cmd === 'pause') Q.audio.pause();
    else if (cmd === 'next') playIndex(Q.i + 1); else if (cmd === 'prev') playIndex(Q.audio.currentTime > 3 ? Q.i : Q.i - 1);
  };
  // Control buttons. Local queue (browser) > host callback (Android) > the prototype's sample song, which just toggles
  // its own state. Play / pause also gets a face reaction, the same one the host's media events trigger.
  ['pointerdown', 'pointerup'].forEach(ev => mediaEl.addEventListener(ev, e => e.stopPropagation()));
  mediaEl.addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    e.stopPropagation();
    const cmd = b.dataset.cmd;
    if (Q.audio) return player.control(cmd);
    if (player.onControl) return player.onControl(cmd);
    if (cmd === 'toggle') { player.set({ playing: !PL.playing }); bbot.event(PL.playing ? 'music-play' : 'music-pause'); }
    else face.react('nod');
  });

  function queueFiles(files, notify) { Q.notify = notify; Q.files = Array.from(files); playIndex(0); }

  function detectHorn(b, hz, lo, hi, top) {
    const t = performance.now();
    let pk = lo;
    for (let i = lo; i <= hi; i++) if (b[i] > b[pk]) pk = i;
    const band = Array.from(b.subarray(lo, top + 1)).sort((x, y) => x - y);
    const floor = band[band.length >> 1];
    let power = 0;
    for (let i = lo; i <= top; i++) power += 10 ** (b[i] / 10);
    const level = 10 * Math.log10(power);
    const harm = Math.max(b[2 * pk - 1], b[2 * pk], b[2 * pk + 1]) - floor;
    const tone = b[pk] - floor, peakHz = pk * hz;
    if (HS.bg === null) { if (level < -110) return; HS.bg = level; }   // wait for real sound before learning the background
    const loud = level - HS.bg;

    const candidate = t - musicAt > HORN.musicGrace && tone > HORN.tone && harm > 10 && loud > (musicOn ? HORN.loudMusic : HORN.loud);
    const steady = Math.abs(peakHz - HS.prevHz) < 30;
    HS.prevHz = peakHz;
    if (candidate && steady) {
      if (!HS.since) HS.since = t;
      if (t - HS.since > HORN.hold && t - HS.last > HORN.cooldown) { HS.last = t; HS.count++; bbot.event('horn'); }
    } else {
      HS.since = 0;
    }
    // Background follows the cabin level with a ~5 s lag (~1.5 s while music plays): a short honk barely moves it,
    // but music lifts the bar until only something clearly louder than the music counts.
    const k = musicOn ? 0.03 : 0.01;
    // Digital silence (a test file ended, mic muted) would drag the background to nothing; ignore it.
    if (level > -110) HS.bg = HS.bg * (1 - k) + level * k;
    HS.info = `horns ${HS.count} · ${musicOn ? 'music on · ' : ''}loud +${loud.toFixed(0)} dB · tone ${tone.toFixed(0)} dB · ${peakHz.toFixed(0)} Hz${candidate ? ' · HORN?' : ''}`;
  }
  // Browsers start audio suspended until a touch.
  addEventListener('pointerdown', () => audioCtx && audioCtx.state === 'suspended' && audioCtx.resume());
  if (new URLSearchParams(location.search).has('mic')) startMic();

  // ---- GPS director. Feed fixes with bbot.gps({ speed (m/s), heading (deg), lat, lon, accuracy (m) }), about 1 Hz.
  //      The Android app feeds LocationManager fixes the same way; ?gps uses the browser's geolocation (secure origin needed,
  //      like the mic). Events are derived here so the Java side stays a thin pipe. ----
  const GPS = { limit: 110, hardBrake: 3.0, hardAccel: 2.5, turnRate: 25, idleWait: 25000, highway: 80, longDrive: 60 * 60000, home: null, homeR: 80 };
  const GS = { last: null, kmh: 0, accel: 0, turn: 0, stoppedAt: 0, movingAt: 0, moving: false, cruiseAt: 0, fired: {}, atHome: null, info: '' };
  const once = (key, every, t, fn) => { if (!GS.fired[key] || t - GS.fired[key] > every) { GS.fired[key] = t; fn(); } };
  const dist = (a, b) => { const R = 6371000, dLat = (b.lat - a.lat) * Math.PI / 180, dLon = (b.lon - a.lon) * Math.PI / 180;
    const x = Math.sin(dLat / 2) ** 2 + Math.cos(a.lat * Math.PI / 180) * Math.cos(b.lat * Math.PI / 180) * Math.sin(dLon / 2) ** 2;
    return 2 * R * Math.asin(Math.sqrt(x)); };

  function gpsFix(f) {
    const t = f.t ?? performance.now();
    if ((f.accuracy ?? 0) > 50) { GS.info = `gps: weak fix (±${Math.round(f.accuracy)} m)`; return; }
    const speed = f.speed ?? 0, kmh = speed * 3.6;
    if (GS.last) {
      const dt = (t - GS.last.t) / 1000;
      if (dt <= 0) return;
      GS.accel = GS.accel * 0.5 + ((speed - (GS.last.speed ?? 0)) / dt) * 0.5;          // m/s², lightly smoothed
      let dh = (f.heading ?? GS.last.heading ?? 0) - (GS.last.heading ?? 0);
      dh = ((dh + 540) % 360) - 180;
      GS.turn = kmh > 10 ? dh / dt : 0;                                                  // deg/s; heading is noise when crawling
    }
    GS.kmh = kmh; GS.last = { ...f, speed, t };

    // Moving / stopped, with hysteresis so GPS jitter at a light doesn't flap.
    if (!GS.moving && kmh > 6) {
      GS.moving = true; GS.movingAt = GS.movingAt || t;
      if (GS.stoppedAt && t - GS.stoppedAt > 8000) once('go', 10000, t, () => show('excited', ['bounce'], 2500));
      GS.stoppedAt = 0;
    } else if (GS.moving && kmh < 2) {
      GS.moving = false; GS.stoppedAt = t; GS.cruiseAt = 0;
    }

    if (GS.moving) {
      if (GS.accel < -GPS.hardBrake) once('brake', 6000, t, () => bbot.event('hard-brake'));
      else if (GS.accel > GPS.hardAccel) once('accel', 6000, t, () => show('excited', ['boing'], 2500));
      if (Math.abs(GS.turn) > GPS.turnRate) {
        const dir = Math.sign(GS.turn);
        once('turn', 3000, t, () => { show('focus', [], 2000); face.look(dir, 0, 2000); });
      } else if (Math.abs(GS.turn) > 6) {
        face.look(Math.max(-1, Math.min(1, GS.turn / 30)), -0.1, 1200);                // gentle bends: just glance into them
      }
      if (kmh > GPS.limit) once('speeding', 20000, t, () => bbot.event('speeding'));
      if (kmh > GPS.highway) { GS.cruiseAt = GS.cruiseAt || t; if (t - GS.cruiseAt > 20000) once('cruise', 120000, t, () => show('focus', [], 6000)); }
      else GS.cruiseAt = 0;
      if (t - GS.movingAt > GPS.longDrive) once('long', 15 * 60000, t, () => show('sleepy', [], 8000));
    } else if (GS.stoppedAt) {
      const wait = t - GS.stoppedAt;
      if (wait > GPS.idleWait) once('wait', 120000, t, () => show('bored', [], 6000));
      if (wait > 90000) once('nap', 300000, t, () => show('sleepy', [], 10000));
    }

    if (GPS.home && f.lat != null) {
      const home = dist(f, GPS.home) < GPS.homeR;
      if (GS.atHome === false && home) once('home', 60000, t, () => bbot.event('arrived'));
      if (GS.atHome === true && !home) once('leave', 60000, t, () => show('curious', ['boing'], 3000));
      GS.atHome = home;
    }
    GS.info = `gps: ${kmh.toFixed(0)} km/h · ${GS.accel >= 0 ? '+' : ''}${GS.accel.toFixed(1)} m/s² · turn ${GS.turn.toFixed(0)}°/s · ${GS.moving ? 'moving' : 'stopped'}${GPS.home ? (GS.atHome ? ' · home' : ' · away') : ''}`;
  }
  EVENTS['hard-brake'] = () => show('scared', ['jitter'], 2500);

  function startGps() {
    if (!navigator.geolocation) { GS.info = 'gps: not available here'; return; }
    navigator.geolocation.watchPosition(
      pos => gpsFix({ lat: pos.coords.latitude, lon: pos.coords.longitude, speed: pos.coords.speed, heading: pos.coords.heading, accuracy: pos.coords.accuracy }),
      err => { GS.info = 'gps: ' + err.message; },
      { enableHighAccuracy: true, maximumAge: 0 });
  }
  if (new URLSearchParams(location.search).has('gps')) startGps();

  // Scripted drive at 5x, 1 fix per simulated second. Each leg: [seconds, km/h at end, heading change in degrees].
  let simTimer;
  function simulateDrive() {
    clearInterval(simTimer);
    const legs = [[10, 0, 0], [6, 50, 0], [15, 50, 0], [3, 50, 90], [10, 50, 0], [3, 0, 0], [30, 0, 0], [8, 60, 0], [6, 60, -80],
                  [12, 95, 0], [25, 95, 0], [6, 125, 0], [8, 125, 0], [10, 40, 0], [10, 40, 0], [4, 0, 0], [12, 0, 0]];
    let leg = 0, i = 0, kmh = 0, heading = 0, lat = -6.842, lon = 107.921, t = 1;
    const from = { kmh: 0, heading: 0 };
    GPS.home = { lat, lon }; GS.atHome = null; GS.last = null; GS.fired = {}; GS.movingAt = 0; GS.stoppedAt = 0; GS.moving = false;
    simTimer = setInterval(() => {
      const [secs, toKmh, dh] = legs[leg], p = (i + 1) / secs;
      kmh = from.kmh + (toKmh - from.kmh) * p; heading = from.heading + dh * p;
      const m = kmh / 3.6; lat += m * Math.cos(heading * Math.PI / 180) / 111000; lon += m * Math.sin(heading * Math.PI / 180) / 111000;
      gpsFix({ lat, lon, speed: m, heading: (heading + 360) % 360, accuracy: 8, t: t * 1000 });
      t++;
      if (++i >= secs) { i = 0; from.kmh = kmh; from.heading = heading; if (++leg >= legs.length) clearInterval(simTimer); }
    }, 200);
  }

  // ---- Weather. Open-Meteo at the last GPS fix (fallback: Sumedang Utara), refreshed every 20 min. The Android app may push
  //      bbot.weather.set({ temp, text, code, place }) instead; the published test page cannot fetch, so it keeps the placeholder.
  //      Icon = Weatherglass TV glass icon for the WMO code (vendor/weatherglass, MIT), night variants 18:00-06:00.
  //      Place = the Android Geocoder's district + city (as in the launcher's Today panel); the browser has no geocoder,
  //      so it shows the fallback city until a GPS fix arrives, then hides the place rather than show the wrong one. ----
  const WX = { 0: 'Clear', 1: 'Mostly clear', 2: 'Partly cloudy', 3: 'Cloudy', 45: 'Fog', 48: 'Fog', 51: 'Drizzle', 53: 'Drizzle', 55: 'Drizzle',
               61: 'Rain', 63: 'Rain', 65: 'Heavy rain', 80: 'Showers', 81: 'Showers', 82: 'Heavy showers', 95: 'Thunderstorm', 96: 'Thunderstorm', 99: 'Thunderstorm' };
  const weatherEl = document.getElementById('weather'), iconEl = document.getElementById('wxIcon'), placeEl = document.getElementById('place');
  const dusk = () => { const h = new Date().getHours(); return h >= 18 || h < 6; };
  const wxIcon = c => c <= 1 ? (dusk() ? 'clear_night' : 'sunny') : c === 2 ? (dusk() ? 'partly_cloudy_night' : 'partly_cloudy_day')
    : c === 3 ? 'cloud' : c <= 48 ? 'foggy' : (c >= 71 && c <= 77) || c === 85 || c === 86 ? 'snowflake' : c >= 95 ? 'thunderstorm' : 'rainy';
  let placePushed = false;
  const weather = {
    set({ temp, text, code, place }) {
      weatherEl.textContent = `${Math.round(temp)}\u00b0${text ? ' ' + text : ''}`;
      if (code != null) iconEl.src = `vendor/weatherglass/${wxIcon(code)}.png`;
      if (place != null) { placePushed = true; placeEl.textContent = place; }
      else if (!placePushed && GS.last) placeEl.textContent = '';
    },
    place(name) { placePushed = true; placeEl.textContent = name; },
    async refresh() {
      const lat = GS.last?.lat ?? -6.842, lon = GS.last?.lon ?? 107.921;
      try {
        const r = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,weather_code`);
        const j = await r.json();
        weather.set({ temp: j.current.temperature_2m, text: WX[j.current.weather_code] || '', code: j.current.weather_code });
      } catch (e) { /* offline or blocked: keep what is shown */ }
    },
  };
  weather.refresh(); setInterval(weather.refresh, 20 * 60000);

  window.bbot = {
    face, show, startMic, player, weather, queueFiles, horn: HS, gps: gpsFix, startGps, simulateDrive, gpsState: GS, gpsConfig: GPS,
    setHome() { if (GS.last && GS.last.lat != null) GPS.home = { lat: GS.last.lat, lon: GS.last.lon }; },
    event(name) { (EVENTS[name] || (() => {}))(); },
    events: Object.keys(EVENTS),
  };

  if (new URLSearchParams(location.search).has('debug')) {
    const bar = document.createElement('div');
    bar.style.cssText = 'position:absolute;right:16px;top:16px;display:flex;flex-wrap:wrap;justify-content:flex-end;gap:6px;max-width:600px;z-index:2';
    for (const name of Object.keys(EVENTS)) {
      const b = document.createElement('button');
      b.textContent = name;
      b.style.cssText = 'font:500 14px Geist,system-ui;color:#f7f8fa;background:#15181b;border:1px solid #2f3336;border-radius:999px;padding:8px 14px;cursor:pointer';
      b.addEventListener('pointerdown', e => { e.stopPropagation(); bbot.event(name); });
      bar.appendChild(b);
    }
    const btnCss = bar.lastChild.style.cssText;
    const mic = document.createElement('button');
    mic.textContent = 'start mic';
    mic.style.cssText = btnCss + ';border-color:#b6ff3b';
    mic.addEventListener('pointerdown', e => { e.stopPropagation(); startMic(); });
    bar.appendChild(mic);

    const pickLabel = document.createElement('label');
    pickLabel.textContent = 'add songs';
    pickLabel.style.cssText = btnCss + ';border-color:#5ec8ff';
    const pick = document.createElement('input');
    pick.type = 'file'; pick.accept = 'audio/*'; pick.multiple = true; pick.id = 'test-file'; pick.hidden = true;
    pickLabel.appendChild(pick);
    const asMusicLabel = document.createElement('label');
    asMusicLabel.style.cssText = 'font:500 14px Geist,system-ui;color:#c9cdd1;display:flex;align-items:center;gap:6px;padding:0 6px;cursor:pointer';
    const asMusic = document.createElement('input');
    asMusic.type = 'checkbox'; asMusic.id = 'as-music'; asMusic.checked = true;
    asMusicLabel.append(asMusic, 'treat as car music');
    const stop = document.createElement('button');
    stop.textContent = 'stop'; stop.style.cssText = btnCss;
    stop.addEventListener('pointerdown', e => { e.stopPropagation(); player.control('pause'); });
    for (const el of [pickLabel, asMusicLabel]) el.addEventListener('pointerdown', e => e.stopPropagation());
    pick.addEventListener('change', () => { if (pick.files.length) queueFiles(pick.files, asMusic.checked); pick.value = ''; });
    bar.append(pickLabel, asMusicLabel, stop);

    const gpsBtn = document.createElement('button');
    gpsBtn.textContent = 'start gps'; gpsBtn.style.cssText = btnCss + ';border-color:#ffb547';
    gpsBtn.addEventListener('pointerdown', e => { e.stopPropagation(); startGps(); });
    const simBtn = document.createElement('button');
    simBtn.textContent = 'simulate drive (5x)'; simBtn.style.cssText = btnCss + ';border-color:#ffb547';
    simBtn.addEventListener('pointerdown', e => { e.stopPropagation(); simulateDrive(); });
    const homeBtn = document.createElement('button');
    homeBtn.textContent = 'set home here'; homeBtn.style.cssText = btnCss;
    homeBtn.addEventListener('pointerdown', e => { e.stopPropagation(); bbot.setHome(); });
    bar.append(gpsBtn, simBtn, homeBtn);
    const meter = document.createElement('div');
    meter.style.cssText = 'flex-basis:100%;font:500 14px Geist,system-ui;color:#9aa0a6;padding:4px 2px;font-variant-numeric:tabular-nums';
    bar.appendChild(meter);
    setInterval(() => { meter.textContent = [HS.on || HS.info ? HS.info : '', GS.info].filter(Boolean).join('   |   '); }, 200);
    screenEl.appendChild(bar);
  }

  // ---- The tablet (Android app only). Bridge.java pushes host.on(type, data): the playing song (controls go back
  //      through Android.media), GPS fixes for the drive reactions and the weather, the place name, and the battery
  //      (plugged in / unplugged / low). Plugging in is also "car start", which goes home when that setting is on. ----
  if (window.Android) {
    const strip = n => (n || '').replace(/^(Kabupaten|Kab\.|Kota|Kecamatan|Kec\.)\s+/i, '');
    let gotFix = false, wasPlaying = null, wasCharging = null, lowShown = false;
    player.onControl = cmd => Android.media(cmd);
    window.host = {
      on(type, d) {
        if (type === 'media') {
          if (!d.pkg || !d.title) { player.set({ title: '', artist: '', playing: false }); return; }
          player.set({ title: d.title, artist: d.artist || '', playing: !!d.playing });
          // Changes react; a song already playing when the screensaver opens starts it grooving too.
          if (wasPlaying !== !!d.playing && (wasPlaying !== null || d.playing)) bbot.event(d.playing ? 'music-play' : 'music-pause');
          wasPlaying = !!d.playing;
        } else if (type === 'battery') {
          if (wasCharging !== null && wasCharging !== !!d.charging) bbot.event(d.charging ? 'charging' : 'unplugged');
          wasCharging = !!d.charging;
          if (!d.charging && d.level <= 15 && !lowShown) { lowShown = true; bbot.event('battery-low'); }
          if (d.charging || d.level > 20) lowShown = false;
        } else if (type === 'gps') {
          if (fromHome && (d.speed || 0) * 3.6 > 10) { location.href = HOME; return; }   // moving off: back to the dashboard
          gpsFix(d);
          if (!gotFix) { gotFix = true; weather.refresh(); }   // weather where the car is, not the fallback
        } else if (type === 'place') {
          const area = strip(d.area), district = strip(d.district);
          if (area || district) weather.place(district && district !== area ? `${district}, ${area}` : area || district);
        } else if (type === 'home') location.href = HOME;
        else if (type === 'car-start') location.href = HOME + '#carstart';   // home opens the nav app
      },
    };
    Android.ready();
  }
</script>
</body>
</html>
