<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Weather Card</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  /* Weather card for the home screen: current conditions only (no hourly list). Big light temperature, condition and place,
     high/low at the bottom, and a soft 3D weather object (cloud, sun, rain) cropped by the bottom-right corner of the card.
     Same Liquid Glass tokens as glass.html. It sits left of a narrower Now playing panel in the bottom row.
     Cost on the tablet: the weather object is drawn once to a canvas per condition change; the only motion is a slow
     transform drift on that canvas, which stops under reduced motion. */
  :root {
    --text: #f7f8fa;
    --muted: rgba(247, 248, 250, 0.72);
    --faint: rgba(247, 248, 250, 0.5);
    --r-glass: 32px;
    --ease: cubic-bezier(0.16, 1, 0.3, 1);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: #07080a; color: var(--text); font-family: "Geist", system-ui, sans-serif; overflow: hidden; -webkit-font-smoothing: antialiased; }

  /* The full 1340 x 800 home canvas, scaled the same way as glass.html, so the card shows at its true size on the tablet.
     The other home panels are drawn as empty outlines in their real positions, for scale only. */
  #stage { position: absolute; left: 50%; top: 50%; width: 1340px; height: 800px; text-shadow: 0 1px 2px rgba(0,0,0,0.25); }
  .wall { position: fixed; inset: 0; background: #1a1d22 url(https://picsum.photos/id/1018/1600/1000) center / cover no-repeat; }
  .wall::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(5,7,10,0.15), rgba(5,7,10,0.45)); }
  .ghost { position: absolute; border-radius: var(--r-glass); border: 1.5px dashed rgba(255,255,255,0.28); background: rgba(10,14,22,0.22);
    display: grid; place-items: center; font-size: 15px; font-weight: 500; color: var(--faint); text-align: center; line-height: 1.4; }

  .glass {
    position: relative; isolation: isolate; border-radius: var(--r-glass); overflow: hidden;
    background: linear-gradient(160deg, rgba(255,255,255,0.13), rgba(255,255,255,0.03) 45%, rgba(10,14,22,0.34));
    backdrop-filter: blur(16px) saturate(1.6) brightness(0.74); -webkit-backdrop-filter: blur(16px) saturate(1.6) brightness(0.74);
    box-shadow: inset 0 1.5px 0 rgba(255,255,255,0.55), inset 0 -1px 0 rgba(255,255,255,0.12), inset 0 0 0 1px rgba(255,255,255,0.14),
      inset 0 0 24px rgba(255,255,255,0.06), 0 18px 40px rgba(4, 8, 16, 0.35);
  }
  .glass::before {
    content: ""; position: absolute; inset: 0; border-radius: inherit; padding: 1.5px; pointer-events: none; z-index: 2;
    background: linear-gradient(135deg, rgba(255,255,255,0.75), rgba(255,255,255,0.08) 30%, rgba(255,255,255,0) 60%, rgba(255,255,255,0.35));
    -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor; mask-composite: exclude;
  }
  @media (prefers-reduced-transparency: reduce) { .glass { background: rgba(28, 32, 40, 0.94); backdrop-filter: none; -webkit-backdrop-filter: none; } }

  /* Weather card. Text sits above the art; the art is pinned to the bottom-right and cropped by the card's corner. */
  .wx { position: absolute; left: 449px; top: 468px; width: 296px; height: 312px; padding: 28px 26px 26px; display: flex; flex-direction: column;
    cursor: pointer; -webkit-tap-highlight-color: transparent; }
  .wx .art { position: absolute; right: -40px; bottom: -44px; width: 340px; height: 300px; z-index: 0; pointer-events: none;
    animation: drift 9s ease-in-out infinite alternate; }
  @keyframes drift { from { transform: translate(0, 0); } to { transform: translate(-6px, -4px); } }
  @media (prefers-reduced-motion: reduce) { .wx .art { animation: none; } }
  /* Icon variant (weather.html?art=icons): the glass weather icons from the Weatherglass TV launcher instead of the canvas art,
     shown at 0.66x of their 256x192 source so they stay sharp on the tablet, and animated per condition:
     clear = sun glow breathes, partly = glow pulses behind the cloud, rain = drops fall (the drops baked into the PNG are
     cropped off), storm = lightning flash, cloudy = slow drift; everything bobs gently.
     Only transform and opacity animate, so the GPU compositor runs it without JS or repaints, and it pauses by itself
     whenever the screen is off or another app covers the launcher. */
  .wx .ibox { position: absolute; right: 14px; bottom: 48px; width: 170px; height: 128px; z-index: 0; pointer-events: none; display: none;
    filter: drop-shadow(0 10px 18px rgba(4, 8, 16, 0.4)); animation: bob 4.5s ease-in-out infinite alternate; }
  .wx.icons .ibox { display: block; }
  .wx.icons .art { display: none; }
  .ibox img { position: absolute; inset: 0; width: 100%; height: 100%; }
  @keyframes bob { from { transform: translateY(2px); } to { transform: translateY(-4px); } }
  /* Glow: a soft disc behind the sun or moon, placed per icon by --gx/--gy/--gr. */
  .ibox .glow { position: absolute; left: var(--gx); top: var(--gy); width: var(--gr); height: var(--gr); margin: calc(var(--gr) / -2) 0 0 calc(var(--gr) / -2);
    border-radius: 50%; background: radial-gradient(circle, var(--gc) 0%, transparent 68%); opacity: 0; }
  .ibox.k-clear .glow, .ibox.k-partly .glow { opacity: 1; animation: glow 3.2s ease-in-out infinite alternate; }
  @keyframes glow { from { transform: scale(0.82); opacity: 0.55; } to { transform: scale(1.12); opacity: 1; } }
  /* Rain: crop the baked drops, then drops fall from under the cloud and fade. */
  .ibox.k-rain .base { clip-path: inset(0 0 17% 0); }
  .ibox .drops { display: none; }
  .ibox.k-rain .drops { display: block; }
  .ibox .drops i { position: absolute; top: 98px; width: 4px; height: 11px; border-radius: 3px;
    background: linear-gradient(#8fd0ff, #3d9bff); opacity: 0; animation: fall 1.1s linear infinite; }
  @keyframes fall { 0% { transform: translate(0, -6px); opacity: 0; } 15% { opacity: 1; } 100% { transform: translate(-4px, 30px); opacity: 0; } }
  /* Storm: a brightened copy of the icon flashes twice every few seconds. */
  .ibox .flash { opacity: 0; filter: brightness(2.1) saturate(0.6); }
  .ibox.k-storm .flash { animation: flash 4.8s linear infinite; }
  @keyframes flash { 0%, 80%, 84%, 88%, 100% { opacity: 0; } 82% { opacity: 0.9; } 86% { opacity: 0.6; } }
  /* Cloudy: a slow sideways drift on top of the bob. */
  .ibox.k-cloudy .base { animation: drift 7s ease-in-out infinite alternate; }
  @media (prefers-reduced-motion: reduce) { .wx .ibox, .ibox *, .ibox .drops i { animation: none !important; } .ibox .drops i { opacity: 0.8; } }
  .hint a { color: var(--muted); }
  .wx .txt { position: relative; z-index: 1; }
  .temp { font-size: 64px; font-weight: 300; letter-spacing: -0.03em; line-height: 1; font-variant-numeric: tabular-nums; }
  .temp small { font-size: 1em; margin-left: 0.18em; letter-spacing: 0; }
  .cond { font-size: 19px; font-weight: 400; color: var(--muted); margin-top: 10px; white-space: nowrap; }
  .hl { position: relative; z-index: 1; margin-top: auto; font-size: 17px; color: var(--faint); font-variant-numeric: tabular-nums; display: flex; gap: 14px; }
  /* Swap: text and art fade together when the condition changes. */
  .wx .txt, .wx .hl, .wx .art, .wx .ibox { transition: opacity 0.35s var(--ease); }
  .wx.swap .txt, .wx.swap .hl, .wx.swap .art, .wx.swap .ibox { opacity: 0; }

  .hint { position: absolute; left: 449px; top: 451px; font-size: 12px; color: var(--faint); }
</style>
</head>
<body>
<div class="wall"></div>
<div id="stage">
  <div class="ghost" style="left:20px;top:20px;width:411px;height:760px">Map</div>
  <div class="ghost" style="left:449px;top:20px;width:392px;height:430px">Today</div>
  <div class="ghost" style="left:859px;top:20px;width:351px;height:430px">Car</div>
  <div class="ghost" style="left:763px;top:468px;width:279px;height:312px">Now playing<br>(narrower)</div>
  <div class="ghost" style="left:1060px;top:468px;width:150px;height:312px">Sliders</div>
  <div class="ghost" style="left:1228px;top:20px;width:96px;height:760px">Sidebar</div>

  <div class="hint" id="hint">Prototype only: tap the card to preview other weather.</div>
  <section class="glass wx" id="wx" role="button" aria-label="Weather">
    <canvas class="art" id="art" width="340" height="300" aria-hidden="true"></canvas>
    <div class="ibox" id="ibox" aria-hidden="true">
      <i class="glow"></i>
      <img class="base" id="icon" alt="">
      <img class="flash" id="flash" alt="">
      <div class="drops"><i style="left:52px;animation-delay:0s"></i><i style="left:66px;animation-delay:.45s"></i><i style="left:80px;animation-delay:.2s"></i><i style="left:94px;animation-delay:.7s"></i><i style="left:108px;animation-delay:.35s"></i><i style="left:120px;animation-delay:.9s"></i></div>
    </div>
    <div class="txt">
      <div class="temp" id="temp">31°<small>C</small></div>
      <div class="cond" id="cond">Partly cloudy - Jakarta</div>
    </div>
    <div class="hl" id="hl"><span>H:33°</span><span>L:25°</span></div>
  </section>
</div>

<script>
  const $ = id => document.getElementById(id);
  const stage = $('stage');
  function fit() { const s = Math.min(innerWidth / 1340, innerHeight / 800); stage.style.transform = `translate(-50%, -50%) scale(${s})`; }
  addEventListener('resize', fit); fit();

  // ---- Weather art. Drawn once per condition: every puff of cloud is a sphere lit from the top-left,
  //      overlapping puffs give the cauliflower look. Seeded random keeps the shape the same on every load. ----
  const cv = $('art'), DPR = Math.min(2, devicePixelRatio || 1), W = 340, H = 300;
  cv.width = W * DPR; cv.height = H * DPR;
  const ctx = cv.getContext('2d');

  function seeded(seed) { return () => (seed = (seed * 16807) % 2147483647) / 2147483647; }

  // ---- Cloud. Built like a volumetric render, not from shaded balls: a few big masses, smaller billows bulging out of
  //      their sunny upper-left rims, and ~1,500 soft particles scattered over the visible surface of every sphere.
  //      Each particle is lit by its own surface normal (Lambert, light from the top-left front), so tops come out bright,
  //      undersides and crevices grey, and the fading particles give the fuzzy edge of vapour. Drawn once per condition.
  const rgba = (c, a) => `rgba(${c[0] | 0},${c[1] | 0},${c[2] | 0},${a})`;
  const mix = (a, b, t) => [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t];
  const LIGHT = (() => { const v = [-0.55, -0.62, 0.56], l = Math.hypot(...v); return v.map(x => x / l); })();

  // Big masses as fractions of the canvas [x, y, radius], kept right of the H/L line.
  const MASS = [[0.78, 0.98, 0.30], [0.97, 0.70, 0.28], [0.60, 1.03, 0.20], [0.84, 0.56, 0.20], [0.70, 0.70, 0.15], [1.03, 0.40, 0.19], [0.90, 0.88, 0.26], [0.56, 0.84, 0.12], [0.92, 0.42, 0.13]];
  const off = document.createElement('canvas'); off.width = W * DPR; off.height = H * DPR;

  function cloud(c, seed) {
    const rnd = seeded(seed);
    // Spheres: masses plus billows on each mass's rim facing the sky. Billows sit a little forward (z) so they overlap.
    const spheres = [];
    for (const [fx, fy, fr] of MASS) {
      const x = fx * W, y = fy * H, r = fr * W;
      spheres.push({ x, y, z: 0, r });
      const n = 4 + Math.floor(rnd() * 3);
      for (let i = 0; i < n; i++) {
        const a = Math.PI * (0.95 + rnd() * 0.75), br = r * (0.34 + rnd() * 0.24);
        spheres.push({ x: x + Math.cos(a) * r * 0.8, y: y + Math.sin(a) * r * 0.8, z: r * 0.35, r: br });
      }
    }
    // Particles on the front hemisphere of each sphere, denser toward the rim where the silhouette forms.
    const parts = [];
    for (const s of spheres) {
      const count = Math.round(60 + s.r * 3.4);
      for (let i = 0; i < count; i++) {
        const ang = rnd() * Math.PI * 2, d = Math.sqrt(0.15 + rnd() * 0.85);  // bias outward
        const nx = Math.cos(ang) * d, ny = Math.sin(ang) * d, nz = Math.sqrt(Math.max(0, 1 - d * d));
        const lam = Math.max(0, nx * LIGHT[0] + ny * LIGHT[1] + nz * LIGHT[2]);
        parts.push({ x: s.x + nx * s.r * 0.92, y: s.y + ny * s.r * 0.92, depth: s.z + nz * s.r,
                     r: s.r * (0.09 + rnd() * 0.12), lam, jitter: rnd() });
      }
    }
    parts.sort((p, q) => p.depth - q.depth);                          // far first, near last

    const g2 = off.getContext('2d');
    g2.setTransform(DPR, 0, 0, DPR, 0, 0); g2.clearRect(0, 0, W, H);
    // Dense core so the cloud is opaque inside, in the mid-shadow tone.
    for (const s of spheres) {
      const g = g2.createRadialGradient(s.x, s.y, 0, s.x, s.y, s.r * 0.9);
      g.addColorStop(0, rgba(c.mid, 1)); g.addColorStop(0.75, rgba(c.mid, 0.9)); g.addColorStop(1, rgba(c.mid, 0));
      g2.fillStyle = g; g2.beginPath(); g2.arc(s.x, s.y, s.r * 0.9, 0, Math.PI * 2); g2.fill();
    }
    for (const p of parts) {
      const t = Math.pow(p.lam, 1.1) * (0.92 + p.jitter * 0.16);
      const col = mix(c.shadow, c.light, Math.min(1, t));
      const g = g2.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.r);
      g.addColorStop(0, rgba(col, 0.95)); g.addColorStop(0.55, rgba(col, 0.75)); g.addColorStop(1, rgba(col, 0));
      g2.fillStyle = g; g2.beginPath(); g2.arc(p.x, p.y, p.r, 0, Math.PI * 2); g2.fill();
    }
    // Bottom of the cloud sits in its own shadow.
    g2.globalCompositeOperation = 'source-atop';
    const ao = g2.createLinearGradient(0, H * 0.45, 0, H); ao.addColorStop(0, 'rgba(0,0,0,0)'); ao.addColorStop(1, rgba(c.base, 0.5));
    g2.fillStyle = ao; g2.fillRect(0, 0, W, H); g2.globalCompositeOperation = 'source-over';

    // Composite: a wide soft shadow on the glass, then the cloud with a touch of blur so particles fuse.
    ctx.save(); ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.filter = `blur(${16 * DPR}px)`; ctx.globalAlpha = 0.4; ctx.drawImage(off, 4 * DPR, 16 * DPR);
    ctx.filter = `blur(${0.4 * DPR}px)`; ctx.globalAlpha = 1; ctx.drawImage(off, 0, 0);
    ctx.restore();
  }

  function sun(x, y, r) {
    const glow = ctx.createRadialGradient(x, y, r * 0.6, x, y, r * 1.9);
    glow.addColorStop(0, 'rgba(255,196,92,0.45)'); glow.addColorStop(1, 'rgba(255,196,92,0)');
    ctx.fillStyle = glow; ctx.beginPath(); ctx.arc(x, y, r * 1.9, 0, Math.PI * 2); ctx.fill();
    const g = ctx.createRadialGradient(x - r * 0.35, y - r * 0.4, r * 0.05, x, y, r);
    g.addColorStop(0, '#fff6d6'); g.addColorStop(0.45, '#ffcf5c'); g.addColorStop(0.9, '#f39a2c'); g.addColorStop(1, '#e8862a');
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
  }

  function rain(seed) {
    const rnd = seeded(seed);
    ctx.save(); ctx.lineCap = 'round';
    for (let i = 0; i < 26; i++) {
      const x = W * (0.44 + rnd() * 0.2), y = H * (0.62 + rnd() * 0.24), len = 10 + rnd() * 12;
      ctx.strokeStyle = `rgba(190,215,240,${0.35 + rnd() * 0.35})`; ctx.lineWidth = 1.6;
      ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x - len * 0.28, y + len); ctx.stroke();
    }
    ctx.restore();
  }

  // light: fully sunlit surface; shadow: surface facing away; mid: the dense core; base: the dark underside.
  const WHITE = { light: [248, 249, 251], shadow: [84, 89, 98], mid: [132, 137, 145], base: [30, 33, 40] };
  const STORM = { light: [176, 182, 191], shadow: [58, 62, 70], mid: [92, 97, 105], base: [14, 16, 20] };
  const ART = {
    partly: () => { sun(W * 0.74, H * 0.46, 46); cloud(WHITE, 7); },
    rain:   () => { cloud(STORM, 11); rain(5); },
    clear:  () => sun(W * 0.80, H * 0.80, 100),
    cloudy: () => cloud(WHITE, 3),
  };
  function paint(kind) { ctx.setTransform(DPR, 0, 0, DPR, 0, 0); ctx.clearRect(0, 0, W, H); ART[kind](); }

  // Conditions to preview. In the app these come from Open-Meteo's current weather_code at the last GPS fix
  // (0 clear, 1-2 partly, 3/45/48 cloudy, 51-67/80-82 rain, 95+ storm uses the rain art).
  const STATES = [
    { kind: 'partly', temp: 31, cond: 'Partly cloudy', hi: 33, lo: 25 },
    { kind: 'rain',   temp: 26, cond: 'Rainy',         hi: 29, lo: 24 },
    { kind: 'clear',  temp: 33, cond: 'Clear',         hi: 34, lo: 26 },
    { kind: 'cloudy', temp: 29, cond: 'Cloudy',        hi: 31, lo: 25 },
    { kind: 'storm',  temp: 25, cond: 'Thunderstorm',  hi: 28, lo: 23 },
  ];
  // Canvas art has no storm of its own yet; it borrows the rain cloud.
  ART.storm = ART.rain;

  // Icon variant: Weatherglass TV's glass icons (vendor/weatherglass, MIT). Night swaps the sun for the moon.
  const ICONS = location.search.includes('art=icons');
  const night = () => { const h = new Date().getHours(); return h >= 18 || h < 6; };
  // Glow position and colour per icon, measured from the 256x192 sources and scaled to the 170x128 box.
  const GLOW = { sunny: [86, 65, 96, 'rgba(255,190,70,0.55)'], partly_cloudy_day: [129, 38, 72, 'rgba(255,190,70,0.6)'],
                 clear_night: [78, 73, 92, 'rgba(190,200,255,0.45)'], partly_cloudy_night: [113, 52, 70, 'rgba(190,200,255,0.5)'] };
  const ICON = { partly: () => night() ? 'partly_cloudy_night' : 'partly_cloudy_day', rain: () => 'rainy',
                 clear: () => night() ? 'clear_night' : 'sunny', cloudy: () => 'cloud', storm: () => 'thunderstorm' };
  if (ICONS) $('wx').classList.add('icons');
  $('hint').innerHTML += ICONS ? ' <a href="?">Show canvas art</a>' : ' <a href="?art=icons">Show Weatherglass icons</a>';
  const PLACE = 'Jakarta';
  let si = 0;
  function show(s) {
    $('temp').innerHTML = `${s.temp}°<small>C</small>`;
    $('cond').textContent = `${s.cond} - ${PLACE}`;
    $('hl').innerHTML = `<span>H:${s.hi}°</span><span>L:${s.lo}°</span>`;
    if (ICONS) {
      const name = ICON[s.kind](), box = $('ibox'), src = `vendor/weatherglass/${name}.png`;
      $('icon').src = src; $('flash').src = s.kind === 'storm' ? src : '';
      box.className = `ibox k-${s.kind}`;
      const g = GLOW[name];
      if (g) { box.style.setProperty('--gx', g[0] + 'px'); box.style.setProperty('--gy', g[1] + 'px'); box.style.setProperty('--gr', g[2] + 'px'); box.style.setProperty('--gc', g[3]); }
    } else paint(s.kind);
  }
  show(STATES[0]);

  $('wx').addEventListener('click', () => {
    const card = $('wx');
    card.classList.add('swap');
    setTimeout(() => { si = (si + 1) % STATES.length; show(STATES[si]); card.classList.remove('swap'); }, 350);
  });
</script>
</body>
</html>
